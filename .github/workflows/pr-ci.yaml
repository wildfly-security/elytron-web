name: Pull Request CI
on:
  pull_request:
    branches:
      - 1.9.x
      - 1.x
      - master

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 11
          cache: 'maven'
      - name: Version Info
        run: mvn -version
      - name: Build with Maven
        run: mvn -B package --file pom.xml
